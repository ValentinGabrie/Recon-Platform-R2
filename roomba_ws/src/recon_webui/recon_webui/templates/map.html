{% extends "base.html" %}
{% block title %}Map{% endblock %}

{% block content %}
<div class="map-header">
    <h1>Live Map</h1>
    <div class="map-controls">
        <button class="btn btn-sm btn-primary" id="btnSaveMap" onclick="saveMap()">Save Map</button>
        <button class="btn btn-sm" id="btnBackToLive" onclick="switchToLive()" style="display:none;">&#9889; Back to Live</button>
        <span id="viewLabel" style="font-size:.78rem; color:#58a6ff; display:none;"></span>
        <span style="flex:1"></span>
        <span id="mapInfo" style="font-size:.78rem; color:#484f58;">20 &times; 20 &middot; 0.05 m/cell</span>
        <div class="btn-group" style="margin-left:.75rem;">
            <button class="mode-btn" data-mode="IDLE" onclick="setMode('IDLE')">IDLE</button>
            <button class="mode-btn" data-mode="SCAN" onclick="setMode('SCAN')">SCAN</button>
        </div>
    </div>
</div>

<div class="map-layout">
    <div class="map-left">
        <div class="map-wrapper">
            <canvas id="mapCanvas" width="600" height="600"></canvas>
            <div class="map-watermark" id="mockWatermark">MOCK MAP</div>
        </div>
        <div class="map-legend">
            <span class="legend-item"><span class="legend-swatch" style="background:#e6edf3;"></span>Free</span>
            <span class="legend-item"><span class="legend-swatch" style="background:#0d1117; border:1px solid #30363d;"></span>Wall</span>
            <span class="legend-item"><span class="legend-swatch" style="background:#30363d;"></span>Unknown</span>
            <span class="legend-item"><span class="legend-swatch" style="background:#58a6ff;"></span>Cursor</span>
        </div>
    </div>

    <div class="map-right">
        <div class="card">
            <div class="card-title">Scanner Position</div>
            <div class="metric">
                <span class="metric-label">X</span>
                <span><span class="metric-value" id="mp-x">—</span><span class="metric-unit">m</span></span>
            </div>
            <div class="metric">
                <span class="metric-label">Y</span>
                <span><span class="metric-value" id="mp-y">—</span><span class="metric-unit">m</span></span>
            </div>
            <div class="metric">
                <span class="metric-label">&theta;</span>
                <span><span class="metric-value" id="mp-theta">—</span><span class="metric-unit">rad</span></span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Saved Maps <span id="mapCount" style="font-weight:400; color:#484f58;"></span></div>
            <div id="savedMapsTableWrap">
                <p id="noMapsMsg" style="color:#484f58; font-size:.82rem;">No saved maps yet.</p>
                <table class="saved-maps-table" id="savedMapsTable" style="display:none;">
                    <thead><tr><th>Name</th><th>Size</th><th></th></tr></thead>
                    <tbody id="savedMapsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let robotPose = { x: 0, y: 0, theta: 0 };
    let lastMapData = null;
    let savedMapData = null;
    let viewingLive = true;

    socket.on('map_update', (data) => {
        lastMapData = data;
        if (viewingLive) {
            drawMap(data);
            drawRobot();
        }
        document.getElementById('mapInfo').innerHTML =
            data.width + ' &times; ' + data.height + ' &middot; ' + data.resolution + ' m/cell';
    });

    socket.on('robot_pose', (data) => {
        robotPose = data;
        document.getElementById('mp-x').textContent = fmt(data.x);
        document.getElementById('mp-y').textContent = fmt(data.y);
        document.getElementById('mp-theta').textContent = fmt(data.theta);
        if (viewingLive && lastMapData) {
            drawMap(lastMapData); drawRobot();
        }
    });

    document.addEventListener('channelStatus', (e) => {
        const mapLive = e.detail.map?.live;
        document.getElementById('mockWatermark').style.display = mapLive ? 'none' : 'block';
    });

    // Pixels per metre — fixed scale; viewport pans with the scanner so the
    // device stays at the canvas centre regardless of map growth.
    const PX_PER_M = 60;

    function poseToCanvas(d, mx, my) {
        // Convert metres-in-map-frame → canvas pixels with the scanner
        // anchored at the canvas centre. y is flipped (image vs world axis).
        const dx = (mx - robotPose.x) * PX_PER_M;
        const dy = (my - robotPose.y) * PX_PER_M;
        return { x: canvas.width / 2 + dx, y: canvas.height / 2 - dy };
    }

    function drawMap(d) {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cellPx = d.resolution * PX_PER_M;
        // Where (origin_x, origin_y) lands on the canvas given current pose.
        const o = poseToCanvas(d, d.origin_x, d.origin_y);

        // Bounds of the visible cell window (cull cells outside the viewport).
        const minCol = Math.max(0,
            Math.floor((-o.x) / cellPx));
        const maxCol = Math.min(d.width - 1,
            Math.ceil((canvas.width - o.x) / cellPx));
        const minRow = Math.max(0,
            Math.floor((o.y - canvas.height) / cellPx));
        const maxRow = Math.min(d.height - 1,
            Math.ceil(o.y / cellPx));

        for (let y = minRow; y <= maxRow; y++) {
            for (let x = minCol; x <= maxCol; x++) {
                const v = d.data[y * d.width + x];
                if (v === 0)        ctx.fillStyle = '#e6edf3';
                else if (v === 100) ctx.fillStyle = '#0d1117';
                else if (v === 50)  ctx.fillStyle = '#58a6ff';
                else if (v === -1)  ctx.fillStyle = '#30363d';
                else                ctx.fillStyle = '#484f58';
                const px = o.x + x * cellPx;
                const py = o.y - (y + 1) * cellPx;
                ctx.fillRect(px, py, cellPx + 0.5, cellPx + 0.5);
            }
        }
    }

    function drawRobot() {
        // Always at viewport centre by construction.
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const size = 12;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-robotPose.theta);

        ctx.fillStyle = '#f85149';
        ctx.beginPath();
        ctx.moveTo(size, 0);
        ctx.lineTo(-size * 0.7, -size * 0.55);
        ctx.lineTo(-size * 0.3, 0);
        ctx.lineTo(-size * 0.7, size * 0.55);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#0d1117';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    let selectedMapId = null;

    async function loadSavedMaps() {
        try {
            const res = await fetch('/api/maps');
            const maps = await res.json();
            const body = document.getElementById('savedMapsBody');
            const table = document.getElementById('savedMapsTable');
            const noMsg = document.getElementById('noMapsMsg');
            const count = document.getElementById('mapCount');
            body.innerHTML = '';

            table.style.display = '';
            noMsg.style.display = 'none';
            count.textContent = maps.length > 0 ? '(' + maps.length + ')' : '';

            const liveTr = document.createElement('tr');
            liveTr.dataset.id = 'live';
            if (viewingLive) liveTr.classList.add('selected');
            liveTr.innerHTML =
                '<td><strong style="color:#58a6ff;">&#9889; Live</strong></td>' +
                '<td colspan="2" style="color:#484f58; font-size:.75rem;">Current map</td>';
            liveTr.style.cursor = 'pointer';
            liveTr.onclick = function() { switchToLive(); };
            body.appendChild(liveTr);

            maps.forEach(m => {
                const tr = document.createElement('tr');
                tr.dataset.id = m.id;
                if (!viewingLive && m.id === selectedMapId) tr.classList.add('selected');
                tr.innerHTML =
                    '<td>' + esc(m.name) + '</td>' +
                    '<td style="font-size:.75rem;color:#484f58;">' + m.width + '&times;' + m.height + '</td>' +
                    '<td style="text-align:right;">' +
                        '<button class="btn btn-sm" onclick="viewMap(' + m.id + ', this)" style="padding:.15rem .4rem;">View</button> ' +
                        '<button class="btn btn-sm btn-danger" onclick="deleteMap(' + m.id + ',\'' + esc(m.name).replace(/'/g, "\\'") + '\')" style="padding:.15rem .4rem;">&times;</button>' +
                    '</td>';
                body.appendChild(tr);
            });
        } catch (e) { console.warn('Failed to load maps:', e); }
    }

    function updateViewControls() {
        document.getElementById('btnBackToLive').style.display = viewingLive ? 'none' : '';
        const label = document.getElementById('viewLabel');
        if (viewingLive) {
            label.style.display = 'none';
        } else {
            label.style.display = '';
            const row = document.querySelector('#savedMapsBody tr.selected td');
            label.textContent = 'Viewing: ' + (row ? row.textContent : 'saved map');
        }
    }

    function switchToLive() {
        viewingLive = true;
        selectedMapId = null;
        savedMapData = null;
        document.querySelectorAll('#savedMapsBody tr').forEach(r => r.classList.remove('selected'));
        const liveRow = document.querySelector('#savedMapsBody tr[data-id="live"]');
        if (liveRow) liveRow.classList.add('selected');
        if (lastMapData) { drawMap(lastMapData); drawRobot(); }
        updateViewControls();
    }

    async function viewMap(id, btn) {
        viewingLive = false;
        selectedMapId = id;
        document.querySelectorAll('#savedMapsBody tr').forEach(r => r.classList.remove('selected'));
        btn.closest('tr').classList.add('selected');
        try {
            const res = await fetch('/api/maps/' + id + '/data');
            if (res.ok) {
                const data = await res.json();
                savedMapData = data;
                drawMap(data);
                drawRobot();
                updateViewControls();
                showToast('Viewing saved map #' + id, 'ok');
            }
        } catch (e) { console.warn('Failed to load map data:', e); }
    }

    loadSavedMaps();

    async function saveMap() {
        const nameInput = prompt('Map name (leave blank for auto):');
        if (nameInput === null) return;
        try {
            const res = await fetch('/api/maps', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: nameInput.trim() })
            });
            const data = await res.json();
            if (data.success) {
                showToast(data.message, 'ok');
                loadSavedMaps();
            } else {
                showToast(data.message || 'Save failed', 'err');
            }
        } catch (e) { showToast('Save failed: ' + e.message, 'err'); }
    }

    socket.on('robot_event', (ev) => {
        if (ev.message === 'SAVE_MAP') {
            showToast('Map save triggered by SAVE button — saving...', 'ok');
        }
    });

    let lastEventId = 0;
    async function pollMapEvents() {
        try {
            const res = await fetch('/api/maps/events?since=' + lastEventId);
            const events = await res.json();
            if (events.length > 0) {
                lastEventId = events[events.length - 1].id;
                let hasSave = false;
                let hasDelete = false;
                for (const ev of events) {
                    if (ev.event_type === 'SAVED') {
                        hasSave = true;
                        showToast('Map saved: ' + ev.map_name, 'ok');
                    } else if (ev.event_type === 'DELETED') {
                        hasDelete = true;
                    }
                }
                if (hasSave || hasDelete) {
                    loadSavedMaps();
                }
            }
        } catch (e) { /* silent — server may be down */ }
    }
    setInterval(pollMapEvents, 3000);
    fetch('/api/maps/events?since=0').then(r => r.json()).then(events => {
        if (events.length > 0) lastEventId = events[events.length - 1].id;
    }).catch(() => {});

    async function deleteMap(id, name) {
        if (!confirm('Delete "' + name + '"?')) return;
        try {
            const res = await fetch('/api/maps/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                showToast('Map deleted', 'ok');
                if (selectedMapId === id) selectedMapId = null;
                loadSavedMaps();
            } else {
                showToast(data.message || 'Delete failed', 'err');
            }
        } catch (e) { showToast('Delete failed: ' + e.message, 'err'); }
    }
</script>
{% endblock %}
