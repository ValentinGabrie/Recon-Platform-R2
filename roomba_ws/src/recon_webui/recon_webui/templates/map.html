{% extends "base.html" %}
{% block title %}Map{% endblock %}

{% block content %}
<div class="map-page">

    <!-- Hero row: status pill + hero scan toggle + scan stats -->
    <div class="hero">
        <span class="hero-pill paused" id="heroPill">PAUSED</span>
        <div class="hero-action">
            <button class="btn btn-primary btn-lg" id="btnScanToggle" onclick="toggleScan()" title="Start or pause SLAM integration (Space)">
                ▶ Start scan <span class="btn-kbd">SPACE</span>
            </button>
        </div>
        <span class="hero-spacer"></span>
        <span class="hero-stat">
            <span>WALKED <span class="stat-val" id="statWalked">0.0 m</span></span>
            <span>UPTIME <span class="stat-val" id="statUptime">00:00</span></span>
        </span>
    </div>

    <!-- Secondary actions -->
    <div class="secondary-actions">
        <button class="btn btn-sm" onclick="saveMap()" title="Save the current map to the database (S)">
            Save map <span class="btn-kbd">S</span>
        </button>
        <button class="btn btn-sm btn-danger" onclick="clearMap()" title="Reset SLAM — discards the live pose graph + occupancy grid (C)">
            Clear map <span class="btn-kbd">C</span>
        </button>
        <button class="btn btn-sm" onclick="clearTrail()" title="Clear the on-map walking trail (T)">
            Clear trail <span class="btn-kbd">T</span>
        </button>
        <a class="btn btn-sm" href="/maps" title="Open saved-maps gallery">View saved →</a>
        <span class="spacer"></span>
        <span class="map-info" id="mapInfo">— × — · — m/cell</span>
    </div>

    <!-- Map canvas -->
    <div class="map-stage">
        <div class="map-wrapper">
            <canvas id="mapCanvas" width="800" height="800"></canvas>
            <div class="map-watermark" id="mockWatermark">MOCK MAP</div>
            <!-- Pose overlay in canvas corner -->
            <div class="pose-overlay">
                <div class="po-row"><span class="po-label">X</span><span class="po-val" id="po-x">—</span></div>
                <div class="po-row"><span class="po-label">Y</span><span class="po-val" id="po-y">—</span></div>
                <div class="po-row"><span class="po-label">θ</span><span class="po-val" id="po-theta">—</span></div>
                <div class="po-walked" id="po-walked">walked 0.00 m</div>
            </div>
        </div>
    </div>

    <div class="map-legend">
        <span class="legend-item"><span class="legend-swatch" style="background:#e8e8e8;"></span>Free</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#000;border-color:#444;"></span>Wall</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#1c1c1c;"></span>Unknown</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#ff3850;border-color:#ff3850;"></span>You</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#00d4ff;border-color:#00d4ff;"></span>Trail</span>
    </div>

    <!-- Event tail (last few events) -->
    <div class="event-tail">
        <div class="et-title">Recent events</div>
        <div id="eventTailList">
            <div class="event"><span class="event-time">—</span><span class="event-type">WAITING</span><span class="event-msg">No events yet.</span></div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let robotPose = { x: 0, y: 0, theta: 0 };
    let lastMapData = null;
    let scanActive = false;
    let scanStartedAt = null;  // timestamp when scan was last started, for uptime

    // -------------------------------------------------------------
    // Hero pill state machine
    // -------------------------------------------------------------
    function renderHero() {
        const pill = document.getElementById('heroPill');
        const btn  = document.getElementById('btnScanToggle');
        if (scanActive) {
            pill.className = 'hero-pill scanning';
            pill.textContent = 'SCANNING';
            btn.innerHTML = '⏸ Pause scan <span class="btn-kbd">SPACE</span>';
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-danger');
        } else {
            pill.className = 'hero-pill paused';
            pill.textContent = 'PAUSED';
            btn.innerHTML = '▶ Start scan <span class="btn-kbd">SPACE</span>';
            btn.classList.remove('btn-danger');
            btn.classList.add('btn-primary');
        }
    }

    function pillFlash(label, klass) {
        const pill = document.getElementById('heroPill');
        const orig = pill.className;
        const origText = pill.textContent;
        pill.className = 'hero-pill ' + klass;
        pill.textContent = label;
        setTimeout(() => {
            pill.className = orig;
            pill.textContent = origText;
        }, 1500);
    }

    // -------------------------------------------------------------
    // Scan toggle (calls /api/scan/start | /api/scan/pause)
    // -------------------------------------------------------------
    function toggleScan() {
        const url = scanActive ? '/api/scan/pause' : '/api/scan/start';
        const btn = document.getElementById('btnScanToggle');
        btn.disabled = true;
        fetch(url, { method: 'POST' })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    scanActive = !!d.active;
                    if (scanActive && !scanStartedAt) scanStartedAt = Date.now();
                    if (!scanActive) scanStartedAt = null;
                    renderHero();
                    if (!d.slam_responded) {
                        showToast('UI updated — slam_toolbox did not respond', 'err');
                    } else if (!d.lidar_responded) {
                        showToast('UI updated — LIDAR motor svc did not respond', 'err');
                    }
                } else {
                    showToast(d.message || 'Scan toggle failed', 'err');
                }
            })
            .catch(e => showToast('Scan toggle failed: ' + e.message, 'err'))
            .finally(() => { btn.disabled = false; });
    }

    // Reflect server-side state pushes
    document.addEventListener('scanState', (e) => {
        const newActive = !!e.detail.active;
        if (newActive && !scanActive) scanStartedAt = Date.now();
        if (!newActive) scanStartedAt = null;
        scanActive = newActive;
        renderHero();
    });

    // Initial fetch (in case we missed the WS event)
    fetch('/api/scan/state').then(r => r.json()).then(d => {
        scanActive = !!d.active;
        if (scanActive) scanStartedAt = Date.now();
        renderHero();
    }).catch(() => renderHero());

    // -------------------------------------------------------------
    // Map drawing
    // -------------------------------------------------------------
    const PX_PER_M = 60;

    function poseToCanvas(d, mx, my) {
        const dx = (mx - robotPose.x) * PX_PER_M;
        const dy = (my - robotPose.y) * PX_PER_M;
        return { x: canvas.width / 2 + dx, y: canvas.height / 2 - dy };
    }

    function drawMap(d) {
        // Background — true black so empty viewport doesn't glow
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cellPx = d.resolution * PX_PER_M;
        const o = poseToCanvas(d, d.origin_x, d.origin_y);

        const minCol = Math.max(0, Math.floor((-o.x) / cellPx));
        const maxCol = Math.min(d.width - 1, Math.ceil((canvas.width - o.x) / cellPx));
        const minRow = Math.max(0, Math.floor((o.y - canvas.height) / cellPx));
        const maxRow = Math.min(d.height - 1, Math.ceil(o.y / cellPx));

        for (let y = minRow; y <= maxRow; y++) {
            for (let x = minCol; x <= maxCol; x++) {
                const v = d.data[y * d.width + x];
                // Same palette as /maps: walls pure black, unknown lifted to a
                // visible fog so wall outlines contrast on BOTH sides (the old
                // #1a1a1a wall on #0a0a0a unknown was invisible at the
                // free/unknown boundary — the live map read as a white cloud).
                if      (v === 0)   ctx.fillStyle = '#e8e8e8';   // free
                else if (v === 100) ctx.fillStyle = '#000';      // wall
                else if (v === -1)  ctx.fillStyle = '#333';      // unknown (fog)
                else                ctx.fillStyle = '#666';      // other
                const px = o.x + x * cellPx;
                const py = o.y - (y + 1) * cellPx;
                ctx.fillRect(px, py, cellPx + 0.5, cellPx + 0.5);
            }
        }
    }

    // Walking trail — ring buffer in map-frame metres
    const TRAIL_MAX = 600;
    const TRAIL_MIN_STEP_M = 0.02;
    const poseTrail = [];

    function drawTrail(d) {
        if (poseTrail.length < 2) return;
        ctx.save();
        ctx.strokeStyle = 'rgba(0, 212, 255, 0.55)';   // cyan
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(0, 212, 255, 0.4)';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        const first = poseToCanvas(d, poseTrail[0].x, poseTrail[0].y);
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < poseTrail.length; i++) {
            const p = poseToCanvas(d, poseTrail[i].x, poseTrail[i].y);
            ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawRobot() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const size = 14;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-robotPose.theta);

        // Outer glow ring
        ctx.shadowColor = 'rgba(255, 56, 80, 0.7)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ff3850';
        ctx.beginPath();
        ctx.moveTo(size, 0);
        ctx.lineTo(-size * 0.7, -size * 0.55);
        ctx.lineTo(-size * 0.3, 0);
        ctx.lineTo(-size * 0.7, size * 0.55);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    // -------------------------------------------------------------
    // Pose channel — drives both the overlay and the trail buffer
    // -------------------------------------------------------------
    socket.on('robot_pose', (data) => {
        robotPose = { x: data.x, y: data.y, theta: data.theta };
        // Push into trail (rate-limited)
        const last = poseTrail.length ? poseTrail[poseTrail.length - 1] : null;
        if (!last || Math.hypot(data.x - last.x, data.y - last.y) >= TRAIL_MIN_STEP_M) {
            poseTrail.push({ x: data.x, y: data.y });
            while (poseTrail.length > TRAIL_MAX) poseTrail.shift();
        }
        // Overlay
        document.getElementById('po-x').textContent = fmt(data.x);
        document.getElementById('po-y').textContent = fmt(data.y);
        document.getElementById('po-theta').textContent = fmt(data.theta);
    });

    socket.on('map_update', (data) => {
        lastMapData = data;
        drawMap(data);
        drawTrail(data);
        drawRobot();
        document.getElementById('mapInfo').textContent =
            data.width + ' × ' + data.height + ' · ' + data.resolution + ' m/cell';
    });

    // -------------------------------------------------------------
    // Watermark on mock/live
    // -------------------------------------------------------------
    document.addEventListener('channelStatus', (e) => {
        const mapLive = e.detail.map?.live;
        document.getElementById('mockWatermark').style.display = mapLive ? 'none' : 'block';
    });

    // -------------------------------------------------------------
    // Walked-distance + uptime counters (top-right of hero)
    // -------------------------------------------------------------
    function walkedDistanceM() {
        let d = 0;
        for (let i = 1; i < poseTrail.length; i++) {
            d += Math.hypot(poseTrail[i].x - poseTrail[i-1].x,
                            poseTrail[i].y - poseTrail[i-1].y);
        }
        return d;
    }
    function fmtMinSec(ms) {
        const s = Math.floor(ms / 1000);
        const m = Math.floor(s / 60);
        return String(m).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    }
    setInterval(() => {
        const d = walkedDistanceM();
        document.getElementById('statWalked').textContent = d.toFixed(1) + ' m';
        document.getElementById('po-walked').textContent = 'walked ' + d.toFixed(2) + ' m';
        if (scanStartedAt) {
            document.getElementById('statUptime').textContent = fmtMinSec(Date.now() - scanStartedAt);
        } else {
            document.getElementById('statUptime').textContent = '00:00';
        }
    }, 500);

    // -------------------------------------------------------------
    // Clear-map (calls /slam_toolbox/reset)
    // -------------------------------------------------------------
    function clearMap() {
        if (!confirm('Reset the live map?\n\nDiscards the current SLAM pose graph and occupancy grid. Saved maps in the database are unaffected, and the current Start/Pause state is preserved.')) return;
        fetch('/api/map/clear', { method: 'POST' })
            .then(r => r.json().then(d => ({ ok: r.ok, body: d })))
            .then(({ ok, body }) => {
                if (ok && body.success) {
                    poseTrail.length = 0;
                    lastMapData = null;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    drawRobot();
                    document.getElementById('mapInfo').textContent = 'cleared · waiting for new scans';
                    pillFlash('CLEARED', 'cleared');
                    showToast('Map cleared', 'ok');
                } else {
                    showToast(body.message || 'Clear map failed', 'err');
                }
            })
            .catch(e => showToast('Clear map failed: ' + e.message, 'err'));
    }

    function clearTrail() { poseTrail.length = 0; showToast('Trail cleared', 'ok'); }

    // -------------------------------------------------------------
    // Save map
    // -------------------------------------------------------------
    async function saveMap() {
        const name = prompt('Map name (leave blank for auto):');
        if (name === null) return;
        try {
            const res = await fetch('/api/maps', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name.trim() })
            });
            const data = await res.json();
            if (data.success) showToast(data.message, 'ok');
            else               showToast(data.message || 'Save failed', 'err');
        } catch (e) { showToast('Save failed: ' + e.message, 'err'); }
    }

    // Save-button-on-device → toast
    socket.on('robot_event', (ev) => {
        if (ev.message === 'SAVE_MAP') showToast('SAVE button pressed on device', 'ok');
    });

    // -------------------------------------------------------------
    // Event tail (last 30 events at bottom of map page)
    // -------------------------------------------------------------
    document.addEventListener('robotEvent', (e) => {
        const list = document.getElementById('eventTailList');
        // Wipe the placeholder on first real event
        if (list.children.length === 1 && list.querySelector('.event-type')?.textContent === 'WAITING') {
            list.innerHTML = '';
        }
        const ev = document.createElement('div');
        ev.className = 'event';
        ev.innerHTML =
            '<span class="event-time">' + timeStr() + '</span>' +
            '<span class="event-type">' + esc(e.detail.type || 'EVENT') + '</span>' +
            '<span class="event-msg">' + esc(e.detail.message || '') + '</span>';
        list.prepend(ev);
        while (list.children.length > 30) list.removeChild(list.lastChild);
    });

    // Poll for headless SAVE/DELETE events (device button → db_node)
    let lastEventId = 0;
    async function pollMapEvents() {
        try {
            const events = await (await fetch('/api/maps/events?since=' + lastEventId)).json();
            if (events.length) {
                lastEventId = events[events.length - 1].id;
                for (const ev of events) {
                    if (ev.event_type === 'SAVED')   showToast('Map saved: ' + ev.map_name, 'ok');
                    if (ev.event_type === 'DELETED') showToast('Map deleted: ' + (ev.map_name || '#' + ev.map_id), 'ok');
                }
            }
        } catch (_) { /* server transient */ }
    }
    setInterval(pollMapEvents, 3000);
    fetch('/api/maps/events?since=0').then(r => r.json()).then(events => {
        if (events.length) lastEventId = events[events.length - 1].id;
    }).catch(() => {});

    // -------------------------------------------------------------
    // Keyboard shortcuts
    // -------------------------------------------------------------
    registerShortcut('space', () => toggleScan(), 'Toggle scan');
    registerShortcut('s',     () => saveMap(),    'Save map');
    registerShortcut('c',     () => clearMap(),   'Clear map');
    registerShortcut('t',     () => { clearTrail(); }, 'Clear trail');

    // Initial render
    renderHero();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawRobot();
</script>
{% endblock %}
