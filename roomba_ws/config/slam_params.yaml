# slam_toolbox online async mode parameters
slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    # H3: optional IMU yaw prior for scan matching. Topic must publish
    # sensor_msgs/Imu with the orientation quaternion populated — see
    # recon_hardware/imu_yaw_integrator.py, which republishes
    # /imu/data_raw → /imu/data after integrating the gyro Z rate.
    # If no /imu/data publisher is up at startup, slam_toolbox falls
    # back to scan-only matching with no warning.
    imu_topic: /imu/data
    use_sim_time: false           # Wall clock — no /clock topic published
    mode: mapping

    # Process parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # Lower map_update_interval so the published OccupancyGrid is rebuilt
    # frequently — this is what lets ray-tracing clear cells where a
    # transient obstacle (passing person) used to be once we look there
    # again. Costs CPU; 1.0 s is a comfortable balance on the Pi 5.
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 12.0         # Match simulated LIDAR range
    # Process scans more often (was 0.5 → 2 Hz). 0.1 lets SLAM keep up at
    # ~10 Hz when handheld motion is fast enough to need it.
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # --- Handheld multi-loop wall consistency -------------------------------
    # minimum_travel_distance / _heading gate when a NEW pose-graph node is
    # added. At 0.0 a node is added on EVERY scan, so standing still (or
    # creeping) layers many slightly-different estimates of the same wall on
    # top of each other → thick / doubled walls when you re-traverse a room.
    # RECOMMENDED for multi-loop scanning: 0.1 m / 0.1 rad so nodes track real
    # motion and each wall is estimated from distinct viewpoints. Left at 0.0
    # here pending a field walk — ARCHITECTURE.md §8 ties 0.0 to "always
    # publishes map→odom TF"; that TF is actually driven by
    # transform_publish_period (0.02 s) independent of node insertion, so the
    # bump is expected to be safe, but verify the pose arrow still updates
    # while stationary before committing it.
    minimum_travel_distance: 0.0      # → try 0.1 on the next walk test
    minimum_travel_heading: 0.0       # → try 0.1 on the next walk test
    # Running scan match keeps more recent scans (was 10) so the local map a
    # returning loop matches against is richer → walls stay registered instead
    # of drifting into a parallel copy. Pure memory/CPU cost, no behaviour risk.
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # Widen loop-closure candidate search (was 3.0). After a lap of drift you
    # return offset from the start; a larger radius lets the closure fire and
    # snap the new lap onto the original walls.
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
