# recon_webui configuration
webui:
  host: "0.0.0.0"
  port: 80

  # WebSocket emit rates (Hz)
  emit_rates:
    map_update: 5.0
    robot_pose: 10.0
    bridge_health: 1.0      # ESP32 diagnostics (frame counts, uptime, status)
    channel_status: 0.5

  # Scan start sequencing.
  # Start scan enables the LIDAR motor, waits `lidar_spinup_s` for the LD14P
  # to reach stable rotation, and only THEN unpauses slam_toolbox. Without
  # the grace period the first spin-up revolutions (partial coverage, RPM
  # still climbing) are integrated into the pose graph as radial streaks —
  # one visible cause of the cloudy saved maps. Runs on the eventlet
  # greenlet, so the wait never blocks the web server. 0 disables.
  scan:
    lidar_spinup_s: 2.5

  # Data channel fallback timeouts (seconds)
  # If no real ROS2 data is received within this window, fall back to mock
  channel_timeouts:
    pose: 2.0
    map: 10.0
    imu: 1.0                # IMU @ 100 Hz, so 1 s = ~100 missed samples
    bridge_health: 3.0      # diag is 1 Hz, allow 3× before mock

  # Hardware front-panel buttons (handled in app.py via /buttons/* topics):
  #   SAVE      → state toggle: scanning → save map to DB + clear cache + stop
  #               LIDAR; stopped → start the LIDAR (keep any cached map)
  #   START/STOP→ restart the whole scanner stack (`restart_cmd`)
  #   SHUTDOWN  → long-press: stop the LIDAR, then power off the Pi (`shutdown_cmd`)
  buttons:
    # Master safety switch. Set false on a dev machine so an accidental press
    # never restarts a systemd unit or powers the box off. SAVE always works.
    enabled: true
    # `--no-block` lets systemctl return before it SIGTERMs the web UI process.
    # Requires the NOPASSWD sudoers rule installed by environment.sh.
    restart_cmd:  ["sudo", "systemctl", "--no-block", "restart", "recon-stack.service"]
    shutdown_cmd: ["sudo", "shutdown", "-h", "now"]
