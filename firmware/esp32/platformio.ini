; =============================================================================
; PlatformIO project for the Recon-Platform-R2 ESP32 I/O hub firmware.
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor
; Clean:    pio run -t clean
; =============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ---- Serial / flashing ------------------------------------------------------
monitor_speed = 115200
upload_speed = 921600
; If `pio` can't auto-detect the port, uncomment and set explicitly:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; ---- Compiler tuning --------------------------------------------------------
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter   ; Wire.h's setTimeOut takes an unused arg in some cores
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Filesystem partitioning + flash size are left at the board defaults
; (4 MB flash, default partition table). Override here if a future build
; needs SPIFFS or OTA slots.
